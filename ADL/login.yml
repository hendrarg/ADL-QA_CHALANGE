info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/users/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
      "email": "admin@example.com",
      "password": "password123"
      }
  auth:
    type: bearer
    token: ""

runtime:
  scripts:
    - type: tests
      code: |-
        const data = res.getBody();
        bru.setEnvVar("access_token", data.token, { persist: true });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
